name: בדיקות

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  # נקרא מזרימת הרילייס — רילייס לא יוצא בלי שהבדיקות עברו.
  workflow_call:

jobs:
  windows:
    name: Windows — מבחני בעלות ותקינות תחביר
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: תקינות תחביר של קובצי PowerShell
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter *.ps1
          foreach ($file in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $errors | ForEach-Object { Write-Host "::error file=$($file.FullName)::$($_.Message)" }
              exit 1
            }
            Write-Host "  תקין: $($file.Name)"
          }

      - name: מבחני בעלות
        shell: pwsh
        run: ./tests/Test-Ownership.ps1

      - name: סריקה יבשה על רץ נקי
        shell: pwsh
        run: |
          # הרץ ללא אוצריא מותקנת: הכלי חייב לסיים בלי שגיאה ובלי ממצאים
          # שמסכנים משהו. זו גם הגנה מפני מטרה חדשה שמזוהה לפי שם בלבד.
          ./Uninstall-Otzaria.ps1 -ReportPath "$env:RUNNER_TEMP\report.json"
          $report = Get-Content "$env:RUNNER_TEMP\report.json" -Raw | ConvertFrom-Json
          $findings = @($report.Findings)
          Write-Host "ממצאים על רץ נקי: $($findings.Count)"
          $findings | ForEach-Object { Write-Host "  $($_.Kind) $($_.Target)" }
          $directories = @($findings | Where-Object { $_.Kind -in @('Directory', 'File') })
          if ($directories.Count -gt 0) {
            Write-Host '::error::נמצאו יעדי קבצים במחשב שאין בו אוצריא — סימן לזיהוי לפי שם בלבד'
            exit 1
          }

  linux:
    name: Linux — מבחני בעלות ותקינות תחביר
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: תקינות תחביר של סקריפט ה-Shell
        run: bash -n uninstall-otzaria.sh && bash -n tests/test-ownership.sh

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck --severity=error uninstall-otzaria.sh tests/test-ownership.sh

      - name: מבחני בעלות
        run: bash tests/test-ownership.sh

      - name: סריקה יבשה על רץ נקי
        run: |
          output="$(bash uninstall-otzaria.sh)"
          echo "$output"
          if echo "$output" | grep -q '\[למחיקה\]'; then
            echo "::error::נמצאו יעדים במחשב שאין בו אוצריא"
            exit 1
          fi

  macos:
    name: macOS — Bash 3.2
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # ‎/bin/bash‎ במק הוא 3.2, והוא הסביבה שבה הסקריפט באמת ירוץ שם.
      - name: מבחני בעלות תחת Bash 3.2
        run: /bin/bash tests/test-ownership.sh

      - name: סריקה יבשה
        run: /bin/bash uninstall-otzaria.sh
